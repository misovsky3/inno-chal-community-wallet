name: Build and deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and verify backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -c "from community_wallet.main import app; print(app.title)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm --version
          npm ci --registry=https://registry.npmjs.org/ --loglevel=verbose

      - name: Upload npm debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: /home/runner/.npm/_logs/*-debug-0.log
          if-no-files-found: warn
          retention-days: 7

      - name: Configure production API URL
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const value = process.env.API_BASE_URL;
            if (!value || !/^https?:\/\//.test(value)) {
              throw new Error("Set the GitHub repository variable API_BASE_URL to the Render service URL.");
            }
            const path = "src/environments/environment.production.ts";
            const source = fs.readFileSync(path, "utf8");
            fs.writeFileSync(path, source.replace("__API_BASE_URL__", value.replace(/\/$/, "")));
          '

      - name: Build Angular for GitHub Pages
        working-directory: frontend
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: npm run build -- --configuration production --base-href "/${REPOSITORY}/"

      - name: Add GitHub Pages SPA fallback
        run: cp frontend/dist/community-wallet-frontend/browser/index.html frontend/dist/community-wallet-frontend/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/community-wallet-frontend/browser

      - name: Deploy frontend to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Trigger Render backend deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipped backend deployment."
          else
            curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          fi