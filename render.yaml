services:
  - type: web
    name: community-wallet-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn community_wallet.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    envVars:
      - key: CORS_ORIGINS
        value: "*"